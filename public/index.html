<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>والپیپرها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<script>try{var s=localStorage.getItem('wp-theme');document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{--bg1:hsl(var(--h) 55% 92%);--bg2:hsl(var(--h) 50% 84%);--c1:rgba(255,255,255,.88);--c2:rgba(255,255,255,.42);--bd:rgba(255,255,255,.75);--sh:hsla(var(--h),70%,28%,.32);--ink:hsl(var(--h) 55% 18%);--mut:hsl(var(--h) 30% 45%);--item:rgba(255,255,255,.7);--inp:rgba(255,255,255,.8);--key:hsla(var(--h),45%,40%,.16);--ring:hsl(var(--h) 60% 70%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg1:hsl(var(--h) 45% 10%);--bg2:hsl(var(--h) 50% 6%);--c1:hsla(var(--h),30%,24%,.78);--c2:hsla(var(--h),40%,8%,.7);--bd:rgba(255,255,255,.5);--sh:hsla(var(--h),60%,4%,.65);--ink:#e8f1fa;--mut:hsl(var(--h) 25% 68%);--item:rgba(255,255,255,.07);--inp:rgba(255,255,255,.09);--key:rgba(255,255,255,.08);--ring:hsl(var(--h) 20% 40%)}
:root{--h:208;--ac1:hsl(var(--h) 80% 56%);--ac2:hsl(var(--h) 85% 44%);--acg:hsla(var(--h),85%,44%,.4);--o1:#2b8ee0;--o2:#0f6cbd;--o3:#0c5a9f;--og:rgba(20,121,212,.35)}
:root[data-accent="red"]{--h:2;--o1:#f0625f;--o2:#d63a3a;--o3:#a82626;--og:rgba(214,58,58,.35)}
:root[data-accent="green"]{--h:150;--o1:#3fc17a;--o2:#1f9d5c;--o3:#157a45;--og:rgba(31,157,92,.35)}
:root[data-accent="purple"]{--h:270;--o1:#a66cf0;--o2:#8544d6;--o3:#642fa8;--og:rgba(133,68,214,.35)}
:root[data-accent="orange"]{--h:27;--o1:#ffa53d;--o2:#f2780c;--o3:#c65a05;--og:rgba(242,120,12,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;width:100%}
*{box-sizing:border-box;font-family:"Vazirmatn",Tahoma,system-ui,sans-serif}
body{position:relative;margin:0;width:100%;min-height:100vh;min-height:100dvh;background:linear-gradient(160deg,var(--bg1),var(--bg2));display:grid;place-items:start center;padding:24px 16px;overflow-x:hidden;color:var(--ink);transition:background .4s}
.stage{position:relative;width:100%;max-width:920px}
.bg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bg i{position:absolute;width:min(520px,125vw);aspect-ratio:1;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 30% 25%,var(--o1),var(--o2) 60%,var(--o3));box-shadow:0 30px 80px var(--og);transition:box-shadow .4s}
.card{position:relative;z-index:1;border-radius:32px;padding:22px;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--c1),var(--c2));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:0 24px 60px var(--sh);transition:background .4s,border-color .4s;contain:layout paint;isolation:isolate}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px 14px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:800;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
[hidden]{display:none!important}
html,body{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac1);outline-offset:2px}
.tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:1;min-width:0}
.sw{display:flex;gap:4px;margin-inline-end:2px}
.sw button{width:17px;height:17px;border-radius:50%;padding:0;border:2px solid transparent;background-clip:padding-box;transition:transform .15s,border-color .2s}
.sw button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.15)}
.tg{width:38px;height:38px;border-radius:13px;background:var(--key);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);display:grid;place-items:center}
.tg svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tg .sun{display:none}[data-theme="dark"] .tg .sun{display:block}[data-theme="dark"] .tg .moon{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{border-radius:20px;overflow:hidden;background:var(--item);display:flex;flex-direction:column;box-shadow:0 10px 22px rgba(20,40,80,.14)}
:root[data-theme="dark"] .tile{box-shadow:0 10px 22px rgba(0,0,0,.4)}
.thumb{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:var(--key);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.thumb:active img{transform:scale(1.04)}
.row{display:flex;align-items:center;gap:4px;padding:9px 10px 4px}
.row span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{font-size:19px;color:var(--mut);padding:0 4px;line-height:1}
.dl{margin:6px 8px 10px;height:36px;border-radius:12px;background:linear-gradient(180deg,var(--ac1),var(--ac2));color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 14px var(--acg);text-decoration:none;white-space:nowrap}
.dl:active{transform:scale(.97)}
.dl svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.empty{grid-column:1/-1;text-align:center;padding:30px 0 6px;color:var(--mut);font-size:14px}
.addbtn{width:38px;height:38px;border-radius:13px;background:linear-gradient(180deg,var(--ac1),var(--ac2));color:#fff;display:grid;place-items:center;box-shadow:0 5px 14px var(--acg);flex:none}
.addbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.pager{display:flex;direction:ltr;align-items:center;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--key);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.pager button.on{background:linear-gradient(180deg,var(--ac1),var(--ac2));color:#fff;box-shadow:0 4px 10px var(--acg)}
.pager .dots{color:var(--mut);font-size:13px;padding:0 2px}
.exitlink{display:block;margin:14px auto 0;font-size:13px;color:var(--mut)}
/* overlay + dialogs (shared) */
.ov{--dg:rgba(255,255,255,.58);--dv:rgba(60,60,67,.22);--dsh:rgba(20,30,50,.28);--dim:rgba(0,0,0,.2);--dtx:hsl(var(--h) 80% 42%);position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;visibility:hidden;transition:visibility 0s .3s}
:root[data-theme="dark"] .ov{--dg:hsla(var(--h),22%,20%,.55);--dv:rgba(255,255,255,.16);--dsh:rgba(0,0,0,.6);--dim:rgba(0,0,0,.42);--dtx:hsl(var(--h) 90% 70%)}
.ov.show{visibility:visible;transition:none}
.ovbg{position:absolute;inset:0;background:var(--dim);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .3s}
.ov.show .ovbg{opacity:1}
.dlg{position:relative;width:100%;max-width:264px;border-radius:20px;overflow:hidden;text-align:center;background:var(--dg);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--bd);box-shadow:0 18px 50px var(--dsh);opacity:0;transform:scale(.9);transition:opacity .22s,transform .32s cubic-bezier(.2,.9,.3,1.15)}
.ov.show .dlg{opacity:1;transform:scale(1)}
.dlg.form{max-width:320px}
.dbody{padding:20px 18px 18px}
.dbody h2{margin:0 0 4px;font-size:16px;font-weight:600}
.dbody p{margin:0;font-size:13px;line-height:1.7;color:var(--mut);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dbody p[hidden]{display:none}
.fbody{padding:18px}
.fbody h2{margin:0 0 14px;font-size:16px;font-weight:700;text-align:center}
.picker{width:100%;max-width:170px;aspect-ratio:9/16;margin:0 auto 14px;border-radius:16px;background:var(--inp);border:1.5px dashed var(--bd);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.picker img{width:100%;height:100%;object-fit:cover;display:none}
.picker.has img{display:block}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut);font-size:12px;padding:0 8px;text-align:center}
.ph svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.picker.has .ph{display:none}
.field{margin-bottom:10px}
.field input{width:100%;height:46px;border:0;border-radius:14px;padding:0 14px;font-size:14px;background:var(--inp);color:var(--ink)}
.field input::placeholder{color:var(--mut)}
.err{font-size:12px;color:#ff3b30;margin:-4px 0 12px;text-align:center;display:none}
.err.show{display:block}
.dbtns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--dv)}
.dbtns button{height:46px;background:none;font-size:15px;color:var(--dtx);transition:background .15s}
.dbtns button+button{border-inline-start:1px solid var(--dv)}
.dbtns #dYes{color:#ff3b30;font-weight:600}
:root[data-theme="dark"] .dbtns #dYes{color:#ff6259}
.dbtns #fOk{color:var(--ac2);font-weight:700}
.dbtns button:active{background:rgba(128,128,128,.22)}
.dbtns button:focus-visible{outline-offset:-3px}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i></div>
<main class="stage">
  <section class="card">
    <div class="top">
      <h1>والپیپرها</h1>
      <div class="tools">
        <div class="sw" role="group" aria-label="رنگ تم">
          <button data-c="blue" style="background:#1479d4" aria-label="آبی" aria-pressed="true"></button>
          <button data-c="red" style="background:#d63a3a" aria-label="قرمز" aria-pressed="false"></button>
          <button data-c="green" style="background:#1f9d5c" aria-label="سبز" aria-pressed="false"></button>
          <button data-c="orange" style="background:#f2780c" aria-label="نارنجی" aria-pressed="false"></button>
          <button data-c="purple" style="background:#8544d6" aria-label="بنفش" aria-pressed="false"></button>
        </div>
        <button class="addbtn" id="lockBtn" aria-label="ورود به حالت مدیر"></button>
        <button class="tg" id="theme" aria-label="تغییر حالت روز و شب">
          <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
    <button type="button" class="exitlink" id="exitAdmin" hidden>خروج از حالت مدیر</button>
  </section>
</main>

<div class="ov" id="ov" aria-hidden="true">
  <div class="ovbg" id="ovbg"></div>
  <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dT" aria-describedby="dM">
    <div class="dbody"><h2 id="dT"></h2><p id="dM"></p></div>
    <div class="dbtns"><button id="dYes">پاک کردن</button><button id="dNo">انصراف</button></div>
  </div>
</div>

<div class="ov" id="pov" aria-hidden="true">
  <div class="ovbg" id="pbg"></div>
  <div class="dlg form" role="dialog" aria-modal="true" aria-labelledby="pT">
    <div class="fbody">
      <h2 id="pT">ورود مدیر</h2>
      <div class="field"><input id="passInput" type="password" placeholder="رمز مدیر" dir="ltr" style="text-align:right"></div>
      <p class="err" id="pErr">رمز اشتباهه</p>
    </div>
    <div class="dbtns"><button id="pOk">ورود</button><button id="pCancel">لغو</button></div>
  </div>
</div>

<div class="ov" id="fov" aria-hidden="true">
  <div class="ovbg" id="fbg"></div>
  <div class="dlg form" role="dialog" aria-modal="true" aria-labelledby="fT">
    <div class="fbody">
      <h2 id="fT">افزودن والپیپر</h2>
      <button type="button" class="picker" id="picker" aria-label="انتخاب عکس">
        <img id="pImg" alt="">
        <span class="ph"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>برای انتخاب عکس بزن</span>
      </button>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="field"><input id="fTitle" placeholder="عنوان (اختیاری)" maxlength="60"></div>
      <div class="field"><input id="fLink" placeholder="لینک تلگرام" dir="ltr" style="text-align:right"></div>
      <p class="err" id="fErr"></p>
    </div>
    <div class="dbtns"><button id="fOk">افزودن</button><button id="fCancel">لغو</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let wps=[];
const PER=6;let page=1;
let adminPass='',adminOn=false;
try{adminPass=sessionStorage.getItem('wp-pass')||'';adminOn=!!adminPass}catch(e){}
async function loadWps(){
  try{const r=await fetch('/api/wallpapers');wps=r.ok?await r.json():[]}catch(e){wps=[]}
  render();
}
const fa=n=>String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function totalPages(){return Math.max(1,Math.ceil(wps.length/PER))}
function render(){
  const tp=totalPages();if(page>tp)page=tp;
  const grid=$('grid');grid.innerHTML='';
  const start=(page-1)*PER;
  const shown=wps.slice(start,start+PER);
  shown.forEach(w=>{
    const tile=document.createElement('div');tile.className='tile';
    const th=document.createElement('button');th.type='button';th.className='thumb';th.setAttribute('aria-label','مشاهده و دانلود '+(w.title||'والپیپر'));
    const img=document.createElement('img');img.src=w.img;img.alt=w.title||'والپیپر';img.loading='lazy';
    th.appendChild(img);th.onclick=()=>window.open(w.link,'_blank','noopener');
    const row=document.createElement('div');row.className='row';
    const sp=document.createElement('span');sp.textContent=w.title||'بدون عنوان';
    row.appendChild(sp);
    if(adminOn){
      const del=document.createElement('button');del.type='button';del.textContent='×';del.setAttribute('aria-label','حذف والپیپر');
      del.onclick=()=>ask('این والپیپر پاک شود؟',w.title?'«'+w.title+'»':'',async()=>{
        try{
          const res=await fetch('/api/wallpapers?id='+encodeURIComponent(w.id),{method:'DELETE',headers:{'x-admin-pass':adminPass}});
          if(res.status===401){setAdmin(false);alert('نشست مدیر منقضی شده؛ دوباره وارد شو.');return}
          if(!res.ok){alert('حذف انجام نشد؛ دوباره امتحان کن.');return}
        }catch(e){alert('اتصال برقرار نشد؛ اینترنتت رو چک کن.');return}
        wps=wps.filter(x=>x!==w);render();
      });
      row.appendChild(del);
    }
    const dl=document.createElement('a');dl.className='dl';dl.href=w.link;dl.target='_blank';dl.rel='noopener';
    dl.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14"/></svg>دانلود';
    tile.append(th,row,dl);grid.appendChild(tile);
  });
  if(!wps.length){const e=document.createElement('p');e.className='empty';e.textContent='هنوز والپیپری اضافه نشده.';grid.appendChild(e)}
  buildPager(tp);
}
function buildPager(tp){
  const pager=$('pager');pager.innerHTML='';
  if(tp<=1)return;
  let nums=[];
  if(tp<=7){for(let i=1;i<=tp;i++)nums.push(i)}
  else{
    nums.push(1);
    if(page>3)nums.push('…');
    for(let i=Math.max(2,page-1);i<=Math.min(tp-1,page+1);i++)nums.push(i);
    if(page<tp-2)nums.push('…');
    nums.push(tp);
  }
  nums.forEach(n=>{
    if(n==='…'){const s=document.createElement('span');s.className='dots';s.textContent='…';pager.appendChild(s);return}
    const b=document.createElement('button');b.type='button';b.textContent=fa(n);b.setAttribute('aria-label','صفحه '+fa(n));
    if(n===page)b.classList.add('on');
    b.onclick=()=>{page=n;render();$('grid').scrollIntoView({block:'start',behavior:'smooth'})};
    pager.appendChild(b);
  });
}

function compress(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=560,scale=Math.min(1,maxW/img.width);
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',.72));
      };
      img.onerror=()=>rej(new Error('bad image'));
      img.src=r.result;
    };
    r.onerror=()=>rej(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

let pickedImg=null,fOpener=null;
function updateAdminUI(){
  $('lockBtn').innerHTML=adminOn?'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>':'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  $('lockBtn').setAttribute('aria-label',adminOn?'افزودن والپیپر':'ورود به حالت مدیر');
  $('exitAdmin').hidden=!adminOn;
}
function setAdmin(v,pass){
  adminOn=v;adminPass=v?pass:'';
  try{v?sessionStorage.setItem('wp-pass',pass):sessionStorage.removeItem('wp-pass')}catch(e){}
  updateAdminUI();render();
}
$('lockBtn').onclick=()=>adminOn?openForm():openPass();
$('exitAdmin').onclick=()=>setAdmin(false);
let pOpener=null;
function openPass(){
  $('passInput').value='';$('pErr').classList.remove('show');pOpener=document.activeElement;
  $('pov').classList.add('show');$('pov').setAttribute('aria-hidden','false');
  setTimeout(()=>$('passInput').focus({preventScroll:true}),0);
}
function closePass(){
  $('pov').classList.remove('show');$('pov').setAttribute('aria-hidden','true');
  if(pOpener&&document.contains(pOpener))pOpener.focus({preventScroll:true});pOpener=null;
}
$('pCancel').onclick=closePass;
$('pbg').onclick=closePass;
$('pOk').onclick=async()=>{
  const val=$('passInput').value;
  $('pOk').disabled=true;
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pass:val})});
    if(res.ok){closePass();setAdmin(true,val)}
    else $('pErr').classList.add('show');
  }catch(e){$('pErr').textContent='اتصال برقرار نشد';$('pErr').classList.add('show')}
  $('pOk').disabled=false;
};
$('passInput').onkeydown=e=>{if(e.key==='Enter')$('pOk').click()};
updateAdminUI();
$('picker').onclick=()=>$('file').click();
$('file').onchange=async()=>{
  const f=$('file').files[0];if(!f)return;
  try{pickedImg=await compress(f);$('pImg').src=pickedImg;$('picker').classList.add('has');$('fErr').classList.remove('show')}
  catch(e){showErr('این فایل قابل خواندن نبود؛ یه عکس دیگه انتخاب کن')}
};
function showErr(m){$('fErr').textContent=m;$('fErr').classList.add('show')}
function openForm(){
  pickedImg=null;$('pImg').src='';$('picker').classList.remove('has');
  $('fTitle').value='';$('fLink').value='';$('fErr').classList.remove('show');
  fOpener=document.activeElement;
  $('fov').classList.add('show');$('fov').setAttribute('aria-hidden','false');
  setTimeout(()=>$('picker').focus({preventScroll:true}),0);
}
function closeForm(){
  $('fov').classList.remove('show');$('fov').setAttribute('aria-hidden','true');
  if(fOpener&&document.contains(fOpener))fOpener.focus({preventScroll:true});
  fOpener=null;
}
$('fCancel').onclick=closeForm;
$('fbg').onclick=closeForm;
$('fOk').onclick=async()=>{
  const link=$('fLink').value.trim();
  if(!pickedImg)return showErr('اول یه عکس برای پیش‌نمایش انتخاب کن');
  if(!/^https?:\/\//i.test(link))return showErr('لینک تلگرام رو کامل و درست وارد کن');
  $('fOk').disabled=true;
  try{
    const res=await fetch('/api/wallpapers',{method:'POST',headers:{'content-type':'application/json','x-admin-pass':adminPass},body:JSON.stringify({title:$('fTitle').value.trim(),link,img:pickedImg})});
    if(res.status===401){showErr('نشست مدیر منقضی شده؛ دوباره وارد شو');setAdmin(false);$('fOk').disabled=false;return}
    if(!res.ok){showErr('ذخیره انجام نشد؛ دوباره امتحان کن');$('fOk').disabled=false;return}
    const item=await res.json();
    wps.unshift(item);page=1;render();closeForm();
  }catch(e){showErr('اتصال برقرار نشد؛ اینترنتت رو چک کن')}
  $('fOk').disabled=false;
};

let pend=null,opener=null;
function ask(title,msg,fn){
  pend=fn;opener=document.activeElement;
  $('dT').textContent=title;$('dM').textContent=msg;$('dM').hidden=!msg;
  $('ov').classList.add('show');$('ov').setAttribute('aria-hidden','false');
  $('dNo').focus({preventScroll:true});
}
function closeAsk(yes){
  if(!$('ov').classList.contains('show'))return;
  const f=pend;pend=null;
  $('ov').classList.remove('show');$('ov').setAttribute('aria-hidden','true');
  if(yes&&f)f();
  if(opener&&document.contains(opener))opener.focus({preventScroll:true});
  opener=null;
}
$('dNo').onclick=()=>closeAsk(false);
$('dYes').onclick=()=>closeAsk(true);
$('ovbg').onclick=()=>closeAsk(false);

document.addEventListener('keydown',e=>{
  const ov=document.querySelector('.ov.show');if(!ov)return;
  if(e.key==='Escape'){ov.id==='fov'?closeForm():ov.id==='pov'?closePass():closeAsk(false)}
  else if(e.key==='Tab'){
    const f=[...ov.querySelectorAll('button,input')].filter(el=>el.offsetParent);
    if(!f.length)return;
    e.preventDefault();
    const i=f.indexOf(document.activeElement);
    f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
  }
});

$('theme').onclick=()=>{const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('wp-theme',n)}catch(e){}};
function setAccent(c,keep){document.documentElement.dataset.accent=c;document.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));if(!keep)try{localStorage.setItem('wp-accent',c)}catch(e){}}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>setAccent(b.dataset.c));
try{setAccent(localStorage.getItem('wp-accent')||'blue',true)}catch(e){}
loadWps();
</script>
